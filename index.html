<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lydia Shan — Product Designer</title>
    <meta name="description" content="Portfolio of Lydia Shan, a product designer currently at Shopify. Designing, building, and making things that feel right." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lydiashan.com/" />
    <meta property="og:title" content="Lydia Shan — Product Designer" />
    <meta property="og:description" content="Portfolio of Lydia Shan, a product designer currently at Shopify. Designing, building, and making things that feel right." />
    <meta property="og:image" content="https://lydiashan.com/og-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lydia Shan — Product Designer" />
    <meta name="twitter:description" content="Portfolio of Lydia Shan, a product designer currently at Shopify." />
    <meta name="twitter:image" content="https://lydiashan.com/og-preview.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Boot spinner: only appears if the app hasn't mounted after 1.5s. React replaces #root's children on first render. -->
    <style>
      .boot-loader {
        position: fixed;
        top: calc(50% - 12px);
        left: calc(50% - 12px);
        width: 24px;
        height: 24px;
        opacity: 0;
        animation:
          boot-loader-in 300ms cubic-bezier(0.22, 0.61, 0.36, 1) 1.5s forwards,
          boot-loader-spin 1.2s cubic-bezier(0.12, 0.8, 0.2, 1) 1.5s infinite;
      }
      @keyframes boot-loader-in { to { opacity: 1; } }
      @keyframes boot-loader-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader { animation: boot-loader-in 300ms ease 1.5s forwards; }
      }
    </style>
  </head>
  <body>
    <div id="root"><img class="boot-loader" src="/favicon.svg" alt="" aria-hidden="true" /></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
