<!--
  v3 — ASCII dolphins.
  Idea: a school of ASCII dolphins (same Courier glyph language as the koi) swims around the hero on
  boids rules — separation, alignment, cohesion — chasing a slow drifting goal so the school travels as
  one. The cursor is a curious diver: at mid range they drift over to look, up close they bolt. A click
  scatters them with a burst of bubbles, and they regroup on their own once you leave.
  Trade-off: no WebGL, cheap, and charming on touch. But it competes with the koi for "the" hero image,
  and it's ambient — great to watch, less of a "thing to do" than v1 or v4.
  Reduced motion: a still school frozen mid-swim; dolphins nearest the pointer brighten instead of moving.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>v3 — ASCII dolphins</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    .hero { display: grid; place-items: center; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hero-copy { z-index: 2; pointer-events: none; }
    .hero-copy a { pointer-events: auto; }
    .hero-word, .hero-subtext {
      text-shadow: 0 0 12px #fff, 0 0 24px #fff, 0 0 4px #fff;
    }
  </style>
</head>
<body>
  <section class="hero">
    <canvas aria-hidden="true"></canvas>
    <div class="hero-copy" data-copy>
      <div class="hero-row">
        <h1 class="hero-word hero-word--left">LYDIA IS</h1>
        <div class="koi"><pre data-koi></pre></div>
        <div class="hero-word hero-word--right"><span data-verb></span><span class="caret">|</span></div>
      </div>
      <p class="hero-subtext" data-subtext></p>
      <div data-chip></div>
    </div>
    <p class="hint" data-hint>Swim near them · click to scatter</p>
  </section>

  <script type="module">
    import { typewriter, loadKoiFrames, playKoi, prefersReduced, subtextHTML, chipHTML, clamp } from './hero.js'

    const reduced = prefersReduced()
    const hero = document.querySelector('.hero')
    const canvas = hero.querySelector('canvas')
    const ctx = canvas.getContext('2d')
    const copy = document.querySelector('[data-copy]')
    document.querySelector('[data-subtext]').innerHTML = subtextHTML()
    document.querySelector('[data-chip]').innerHTML = chipHTML()
    const verbEl = document.querySelector('[data-verb]')
    typewriter((t) => { verbEl.textContent = t }, { reduced })
    loadKoiFrames().then((frames) => playKoi(document.querySelector('[data-koi]'), frames, { reduced }))

    // Two tail poses, facing right. Mirrored on the canvas for leftward swimmers.
    const POSES = [
      ['        ,', '      __)\\_', '(\\_.-\'    a`-.', '(/~~````(/~^^`'],
      ['        ,', '      __)\\_', ' _\\.-\'    a`-.', '\\/~~````(/~^^`'],
    ]
    const FONT_PX = 14
    const dpr = Math.min(devicePixelRatio, 2)

    const sprites = POSES.map((lines) => {
      const c = document.createElement('canvas')
      const w = 15 * FONT_PX * 0.62
      const h = lines.length * FONT_PX
      c.width = Math.ceil(w * dpr)
      c.height = Math.ceil(h * dpr)
      const g = c.getContext('2d')
      g.scale(dpr, dpr)
      g.font = `700 ${FONT_PX}px "Courier New", monospace`
      g.fillStyle = '#001dd9'
      g.textBaseline = 'top'
      lines.forEach((line, i) => g.fillText(line, 0, i * FONT_PX))
      return { c, w, h }
    })

    let W = 0
    let H = 0
    let textBox = { cx: 0, cy: 0, rx: 1, ry: 1 }
    function resize() {
      W = hero.clientWidth
      H = hero.clientHeight
      canvas.width = Math.round(W * dpr)
      canvas.height = Math.round(H * dpr)
      const r = copy.getBoundingClientRect()
      const o = hero.getBoundingClientRect()
      textBox = { cx: r.left - o.left + r.width / 2, cy: r.top - o.top + r.height / 2, rx: r.width / 2 + 30, ry: r.height / 2 + 20 }
      if (reduced) drawStill()
    }

    // Seeded so the reduced-motion still is the same every load.
    let seed = 7
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)

    const count = () => clamp(Math.round((W * H) / 100000), 9, 24)
    const boids = []
    function spawn() {
      boids.length = 0
      const n = count()
      const cx = W * 0.28
      const cy = H * 0.3
      for (let i = 0; i < n; i++) {
        const a = rand() * Math.PI * 2
        const depth = 0.6 + rand() * 0.55
        boids.push({
          x: cx + Math.cos(a) * rand() * 180,
          y: cy + Math.sin(a) * rand() * 110,
          vx: 1.4 + rand() * 0.4,
          vy: (rand() - 0.5) * 0.6,
          depth,
          wander: rand() * Math.PI * 2,
          tail: rand() * 10,
          excited: 0,
          glow: 0,
        })
      }
    }

    const pointer = { x: 0, y: 0, active: false }
    const bubbles = []

    function local(e) {
      const r = hero.getBoundingClientRect()
      return [e.clientX - r.left, e.clientY - r.top]
    }
    hero.addEventListener('pointermove', (e) => {
      ;[pointer.x, pointer.y] = local(e)
      pointer.active = true
      if (reduced) drawStill()
    })
    hero.addEventListener('pointerleave', () => {
      pointer.active = false
      if (reduced) drawStill()
    })
    hero.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') pointer.active = false })
    hero.addEventListener('pointerdown', (e) => {
      ;[pointer.x, pointer.y] = local(e)
      pointer.active = true
      if (reduced) return drawStill()
      for (const b of boids) {
        const dx = b.x - pointer.x
        const dy = b.y - pointer.y
        const d = Math.hypot(dx, dy) || 1
        if (d > 340) continue
        const k = 7 * (1 - d / 340) + 1.5
        b.vx += (dx / d) * k
        b.vy += (dy / d) * k
        b.excited = 1
      }
      for (let i = 0; i < 14; i++) bubble(pointer.x + (Math.random() - 0.5) * 40, pointer.y + (Math.random() - 0.5) * 30, 1.2)
    })

    function bubble(x, y, size = 1) {
      if (bubbles.length > 120) return
      bubbles.push({ x, y, vy: -(0.4 + Math.random() * 0.6), life: 1, size: size * (0.7 + Math.random() * 0.6), phase: Math.random() * 6 })
    }

    // The school chases a slow Lissajous goal so it roams the whole hero as one body.
    const goalAt = (t) => ({
      x: W * (0.5 + 0.36 * Math.sin(t * 0.00011)),
      y: H * (0.5 + 0.3 * Math.sin(t * 0.00017 + 1.3)),
    })

    const SEP = 115
    const VIEW = 220
    const FLEE = 120
    const CURIOUS = 300

    function step(f, t) {
      const goal = goalAt(t)
      for (const b of boids) {
        let sx = 0, sy = 0, ax = 0, ay = 0, cx = 0, cy = 0, n = 0
        for (const o of boids) {
          if (o === b) continue
          const dx = o.x - b.x
          const dy = o.y - b.y
          const d = Math.hypot(dx, dy)
          if (d < SEP && d > 0) { sx -= (dx / d) * (SEP - d) / SEP; sy -= (dy / d) * (SEP - d) / SEP }
          if (d < VIEW) { ax += o.vx; ay += o.vy; cx += o.x; cy += o.y; n++ }
        }
        let fx = sx * 0.3
        let fy = sy * 0.3
        if (n) {
          fx += (ax / n - b.vx) * 0.045 + (cx / n - b.x) * 0.0005
          fy += (ay / n - b.vy) * 0.045 + (cy / n - b.y) * 0.0005
        }
        fx += (goal.x - b.x) * 0.00022
        fy += (goal.y - b.y) * 0.00022

        b.wander += (Math.random() - 0.5) * 0.35 * f
        fx += Math.cos(b.wander) * 0.03
        fy += Math.sin(b.wander) * 0.02

        let speedCap = 2.3 * b.depth
        if (pointer.active) {
          const dx = b.x - pointer.x
          const dy = b.y - pointer.y
          const d = Math.hypot(dx, dy) || 1
          if (d < FLEE) {
            const k = (1 - d / FLEE) ** 2 * 1.4
            fx += (dx / d) * k
            fy += (dy / d) * k
            b.excited = Math.max(b.excited, 1 - d / FLEE)
          } else if (d < CURIOUS) {
            fx -= (dx / d) * 0.018
            fy -= (dy / d) * 0.018
            speedCap *= 0.75
          }
        }

        const qx = (b.x - textBox.cx) / textBox.rx
        const qy = (b.y - textBox.cy) / textBox.ry
        const q = qx * qx + qy * qy
        if (q < 1) {
          const len = Math.hypot(qx, qy) || 1
          fx += (qx / len) * (1 - q) * 0.45
          fy += (qy / len) * (1 - q) * 0.45
        }

        const m = 70
        if (b.x < m) fx += (m - b.x) * 0.004
        if (b.x > W - m) fx -= (b.x - (W - m)) * 0.004
        if (b.y < m) fy += (m - b.y) * 0.004
        if (b.y > H - m) fy -= (b.y - (H - m)) * 0.004

        b.vx += fx * f
        b.vy += fy * f
        // Dolphins swim forward, not sideways — keep the climb shallow.
        b.vy = clamp(b.vy, -Math.abs(b.vx) * 0.9 - 0.4, Math.abs(b.vx) * 0.9 + 0.4)
        const cap = speedCap * (1 + b.excited * 1.8)
        const sp = Math.hypot(b.vx, b.vy)
        if (sp > cap) { b.vx *= cap / sp; b.vy *= cap / sp }
        if (sp < 0.5) { b.vx *= 0.5 / (sp || 1); b.vy *= 0.5 / (sp || 1) }

        b.x += b.vx * f
        b.y += b.vy * f
        b.tail += sp * 0.09 * f
        b.excited = Math.max(0, b.excited - 0.012 * f)
        if (b.excited > 0.5 && Math.random() < 0.08 * f) bubble(b.x - Math.sign(b.vx) * 30, b.y + 8, 0.7)
      }

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const p = bubbles[i]
        p.y += p.vy * f
        p.x += Math.sin(p.phase + p.y * 0.05) * 0.3 * f
        p.life -= 0.012 * f
        if (p.life <= 0) bubbles.splice(i, 1)
      }
    }

    function drawDolphin(b, alpha) {
      const sprite = sprites[Math.floor(b.tail) % 2]
      const dir = b.vx < 0 ? -1 : 1
      const tilt = clamp(Math.atan2(b.vy, Math.abs(b.vx)), -0.4, 0.4)
      const s = b.depth
      ctx.setTransform(dpr * s * dir, 0, 0, dpr * s, b.x * dpr, b.y * dpr)
      ctx.rotate(tilt)
      ctx.globalAlpha = alpha
      ctx.drawImage(sprite.c, -sprite.w / 2, -sprite.h / 2, sprite.w, sprite.h)
    }

    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0)
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      const order = [...boids].sort((a, b) => a.depth - b.depth)
      for (const b of order) drawDolphin(b, clamp(0.35 + (b.depth - 0.6) * 0.9 + b.excited * 0.3, 0.3, 1))

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      ctx.fillStyle = '#001dd9'
      ctx.font = `700 ${FONT_PX}px "Courier New", monospace`
      ctx.textAlign = 'center'
      for (const p of bubbles) {
        ctx.globalAlpha = p.life * 0.7
        ctx.font = `700 ${Math.round(FONT_PX * p.size)}px "Courier New", monospace`
        ctx.fillText(p.life > 0.5 ? 'o' : '°', p.x, p.y)
      }
      ctx.globalAlpha = 1
    }

    function drawStill() {
      const near = (b) => pointer.active ? clamp(1 - Math.hypot(b.x - pointer.x, b.y - pointer.y) / 220, 0, 1) : 0
      ctx.setTransform(1, 0, 0, 1, 0, 0)
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      for (const b of [...boids].sort((a, b) => a.depth - b.depth)) drawDolphin(b, clamp(0.3 + (b.depth - 0.6) * 0.8 + near(b) * 0.6, 0.25, 1))
    }

    new ResizeObserver(() => {
      const first = !W
      resize()
      if (first) {
        spawn()
        if (reduced) {
          // Freeze a school that's already mid-swim rather than the spawn clump.
          for (let i = 0; i < 420; i++) step(1, i * 16)
          bubbles.length = 0
          drawStill()
        }
      }
    }).observe(hero)

    if (reduced) {
      document.querySelector('[data-hint]').textContent = 'Point at the school'
    } else {
      let last = performance.now()
      const loop = (now) => {
        const f = Math.min((now - last) / 16.67, 3)
        last = now
        if (W) { step(f, now); draw() }
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    }
  </script>
</body>
</html>
